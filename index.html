<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Shit Done (GSD) Board</title>
    <style>
        /* ==========================================================================
           1. CSS Variables & Theme Setup
           ========================================================================== */
        :root[data-theme="dark"] {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --column-bg: rgba(30, 41, 59, 0.5);
            --border-color: #334155;
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;

            --priority-low-bg: rgba(16, 185, 129, 0.15);
            --priority-low-text: #34d399;
            --priority-medium-bg: rgba(245, 158, 11, 0.15);
            --priority-medium-text: #fbbf24;
            --priority-high-bg: rgba(239, 68, 68, 0.15);
            --priority-high-text: #f87171;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);

            --modal-overlay-bg: rgba(15, 23, 42, 0.75);
        }

        :root[data-theme="light"] {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --surface-hover: #e2e8f0;
            --column-bg: rgba(226, 232, 240, 0.6);
            --border-color: #cbd5e1;
            
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #059669;
            --success-hover: #047857;
            --danger: #dc2626;
            --danger-hover: #b91c1c;

            --priority-low-bg: rgba(16, 185, 129, 0.15);
            --priority-low-text: #059669;
            --priority-medium-bg: rgba(245, 158, 11, 0.15);
            --priority-medium-text: #d97706;
            --priority-high-bg: rgba(239, 68, 68, 0.15);
            --priority-high-text: #dc2626;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.15);

            --modal-overlay-bg: rgba(15, 23, 42, 0.4);
        }

        :root {
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 16px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Dynamic Link Badge Themes */
        .link-badge { display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.25rem 0.55rem; font-size: 0.75rem; font-weight: 500; border-radius: var(--radius-sm); text-decoration: none; transition: var(--transition); border: 1px solid transparent; }
        .link-badge-doc { background-color: rgba(56, 189, 248, 0.15); color: #38bdf8; border-color: rgba(56, 189, 248, 0.3); }
        .link-badge-doc:hover { background-color: rgba(56, 189, 248, 0.25); }
        .link-badge-website { background-color: rgba(168, 85, 247, 0.15); color: #c084fc; border-color: rgba(168, 85, 247, 0.3); }
        .link-badge-website:hover { background-color: rgba(168, 85, 247, 0.25); }
        .link-badge-email { background-color: rgba(255, 122, 89, 0.15); color: #ff7a59; border-color: rgba(255, 122, 89, 0.3); }
        .link-badge-email:hover { background-color: rgba(255, 122, 89, 0.25); }
        .link-badge-file { background-color: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
        .link-badge-file:hover { background-color: rgba(34, 197, 94, 0.25); }

        /* Custom Labels Styling */
        .card-labels-container { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-bottom: 0.2rem; }
        .card-label-badge { font-size: 0.65rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 9999px; color: #ffffff; letter-spacing: 0.02em; display: inline-flex; align-items: center; }
        
        .labels-editor-container { display: flex; flex-direction: column; gap: 0.5rem; }
        .label-input-row { display: flex; gap: 0.5rem; align-items: center; }
        .label-color-picker { width: 36px; height: 34px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 2px; cursor: pointer; background: var(--bg-color); flex-shrink: 0; }

        /* ==========================================================================
           2. Base & Layout
           ========================================================================== */
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        header {
            padding: 1rem 1.5rem;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header-title { display: flex; align-items: center; gap: 0.75rem; }
        .header-title h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.025em; }
        .header-actions { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }

        .board-container {
            flex: 1;
            padding: 1.5rem;
            display: flex;
            gap: 1.25rem;
            align-items: flex-start;
            overflow-x: auto;
            height: calc(100vh - 75px);
        }

        /* ==========================================================================
           3. Buttons & Controls
           ========================================================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.45rem 0.85rem;
            font-size: 0.825rem;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-primary { background-color: var(--primary); color: #ffffff; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); color: #ffffff; }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-secondary { background-color: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); }
        .btn-secondary:hover { background-color: var(--border-color); }

        .btn-icon {
            padding: 0.35rem;
            background: transparent;
            color: var(--text-secondary);
            border-radius: var(--radius-sm);
            border: none;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn-icon:hover { background-color: var(--surface-hover); color: var(--text-primary); }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.45rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--surface-color);
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
        }
        .theme-toggle-btn:hover { background-color: var(--surface-hover); }

        /* ==========================================================================
           4. Column Styles
           ========================================================================== */
        .column {
            background-color: var(--column-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            max-height: 100%;
            height: 100%;
            min-width: 320px;
            width: 320px;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .column.column-dragging { opacity: 0.4; transform: scale(0.98); }

        .column-header {
            padding: 1rem 1.25rem 0.75rem 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            cursor: grab;
        }
        .column-header:active { cursor: grabbing; }

        .column-header-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        
        .column-title-input {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-primary);
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            padding: 0.2rem 0.4rem;
            width: 100%;
            outline: none;
            transition: var(--transition);
        }
        .column-title-input:hover { border-color: var(--border-color); background-color: var(--bg-color); }
        .column-title-input:focus { border-color: var(--primary); background-color: var(--bg-color); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

        .column-controls { display: flex; align-items: center; justify-content: space-between; gap: 0.25rem; width: 100%; }
        .column-nav-btns { display: flex; align-items: center; gap: 0.2rem; }

        .badge {
            background-color: var(--surface-hover);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
        }

        .task-list {
            padding: 0.85rem;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 100px;
            transition: var(--transition);
        }

        .task-list.drag-over {
            background-color: rgba(59, 130, 246, 0.08);
            outline: 2px dashed var(--primary);
            outline-offset: -8px;
            border-radius: var(--radius-md);
        }

        /* ==========================================================================
           5. Compact Card Layout
           ========================================================================== */
        .task-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 0.85rem;
            box-shadow: var(--shadow-sm);
            cursor: grab;
            transition: border-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            flex-shrink: 0;
            user-select: none;
        }

        .task-card:hover { border-color: var(--text-muted); transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .task-card:active { cursor: grabbing; }
        .task-card.dragging { opacity: 0.4; transform: scale(0.98); }

        .task-card-top { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
        .priority-tag { padding: 0.15rem 0.45rem; border-radius: var(--radius-sm); font-weight: 700; text-transform: uppercase; font-size: 0.625rem; letter-spacing: 0.05em; display: inline-block; }
        .priority-low { background-color: var(--priority-low-bg); color: var(--priority-low-text); }
        .priority-medium { background-color: var(--priority-medium-bg); color: var(--priority-medium-text); }
        .priority-high { background-color: var(--priority-high-bg); color: var(--priority-high-text); }

        .task-title-link {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.35;
            word-break: break-word;
            cursor: pointer;
            transition: var(--transition);
            user-select: text;
        }
        .task-title-link:hover { color: var(--primary); text-decoration: underline; }

        .task-card-actions { display: flex; gap: 0.1rem; opacity: 0.6; transition: var(--transition); }
        .task-card:hover .task-card-actions { opacity: 1; }

        .task-single-line-preview {
            font-size: 0.8rem;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: text;
        }

        .task-links-container { display: flex; flex-wrap: wrap; gap: 0.35rem; }

        .card-checklist { display: flex; flex-direction: column; gap: 0.35rem; padding-top: 0.25rem; border-top: 1px solid var(--border-color); }
        .checklist-header-toggle { display: flex; justify-content: space-between; align-items: center; font-size: 0.725rem; color: var(--text-muted); }
        .checklist-progress-bar { height: 4px; background-color: var(--bg-color); border-radius: 2px; overflow: hidden; }
        .checklist-progress-fill { height: 100%; background-color: var(--primary); transition: width 0.3s ease; }

        .checklist-item { display: flex; align-items: center; gap: 0.4rem; font-size: 0.775rem; color: var(--text-secondary); cursor: pointer; user-select: text; }
        .checklist-item input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid var(--text-muted);
            border-radius: 3px;
            background-color: var(--bg-color);
            cursor: pointer;
            display: grid;
            place-content: center;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .checklist-item input[type="checkbox"]:checked { background-color: var(--primary); border-color: var(--primary); }
        .checklist-item input[type="checkbox"]:checked::before { content: "✓"; font-size: 10px; color: white; font-weight: bold; }
        .checklist-item.completed span { text-decoration: line-through; color: var(--text-muted); }

        .task-footer { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 0.35rem; font-size: 0.725rem; color: var(--text-muted); gap: 0.5rem; }
        .date-badge { display: flex; align-items: center; gap: 0.25rem; }
        .date-badge.overdue { color: var(--priority-high-text); font-weight: 700; }

        .empty-state { text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.85rem; border: 1px dashed var(--border-color); border-radius: var(--radius-md); pointer-events: none; }

        /* ==========================================================================
           6. Modal Styles
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--modal-overlay-bg);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: var(--transition);
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 680px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: var(--transition);
            overflow: hidden;
        }

        .modal-overlay.active .modal { transform: translateY(0); }

        .modal-header { padding: 1.1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .modal-title-group { display: flex; align-items: center; gap: 0.75rem; }
        .modal-title { font-size: 1.2rem; font-weight: 700; }

        #task-form { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
        .modal-body { padding: 1.25rem 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1.1rem; flex: 1; }

        .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
        .form-group label { font-size: 0.825rem; font-weight: 600; color: var(--text-secondary); display: flex; align-items: center; gap: 0.4rem; justify-content: space-between; }

        .form-control {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 0.55rem 0.75rem;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 0.875rem;
            outline: none;
            transition: var(--transition);
        }

        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        textarea.form-control { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .view-field-value {
            font-size: 0.875rem;
            color: var(--text-primary);
            background-color: var(--bg-color);
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .view-field-value a { color: var(--primary); text-decoration: underline; }

        .modal-checklist-list { display: flex; flex-direction: column; gap: 0.4rem; margin-bottom: 0.5rem; }
        .modal-checklist-row { display: flex; align-items: center; gap: 0.5rem; background-color: var(--bg-color); padding: 0.4rem 0.6rem; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
        .modal-checklist-row input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text-primary); font-size: 0.85rem; outline: none; }

        .add-checklist-group { display: flex; gap: 0.5rem; }

        /* Dynamic Multi-Link Editor */
        .links-editor-container { display: flex; flex-direction: column; gap: 0.5rem; }
        .link-input-row { display: flex; gap: 0.5rem; align-items: center; }

        /* Comment Editor & Activity List */
        .comment-editor-wrapper { background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-sm); display: flex; flex-direction: column; overflow: hidden; transition: var(--transition); }
        .comment-editor-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }

        .rich-toolbar { display: flex; align-items: center; gap: 0.25rem; padding: 0.35rem 0.5rem; background-color: var(--surface-hover); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .toolbar-btn { background: transparent; border: none; color: var(--text-secondary); padding: 0.25rem 0.4rem; font-size: 0.8rem; font-weight: 600; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .toolbar-btn:hover { background-color: var(--border-color); color: var(--text-primary); }

        .rich-editor-input { min-height: 80px; max-height: 180px; padding: 0.65rem; color: var(--text-primary); font-size: 0.85rem; line-height: 1.5; outline: none; overflow-y: auto; white-space: normal; word-break: break-word; }
        .rich-editor-input:empty::before { content: attr(placeholder); color: var(--text-muted); pointer-events: none; display: block; }
        .rich-editor-input ul, .rich-editor-input ol, .comment-text ul, .comment-text ol, .rich-view-content ul, .rich-view-content ol { padding-left: 1.25rem; margin: 0.3rem 0; }
        .rich-editor-input p, .comment-text p, .rich-view-content p { margin-bottom: 0.3rem; }
        .rich-editor-input a, .comment-text a, .rich-view-content a { color: var(--primary); text-decoration: underline; }

        .comment-editor-actions { display: flex; justify-content: flex-end; padding: 0.4rem 0.65rem; background-color: var(--surface-hover); border-top: 1px solid var(--border-color); gap: 0.5rem; }
        .comments-list { display: flex; flex-direction: column; gap: 0.65rem; max-height: 220px; overflow-y: auto; margin-bottom: 0.5rem; padding-right: 0.25rem; }
        .comment-item { background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 0.65rem 0.8rem; display: flex; flex-direction: column; gap: 0.35rem; position: relative; }
        .comment-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.725rem; color: var(--text-muted); }
        .comment-actions { display: flex; gap: 0.3rem; }
        .comment-text { font-size: 0.825rem; color: var(--text-primary); line-height: 1.45; word-break: break-word; }

        .modal-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 0.75rem; background-color: var(--surface-color); flex-shrink: 0; }

        /* Custom Toggle Switch */
        .switch { position: relative; display: inline-block; width: 32px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: var(--border-color); transition: .2s; border-radius: 18px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(14px); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary);">
                <rect width="18" height="18" x="3" y="3" rx="2"/>
                <path d="M8 7v10"/>
                <path d="M12 7v6"/>
                <path d="M16 7v8"/>
            </svg>
            <h1>Get Shit Done (GSD) Board</h1>
        </div>
        <div class="header-actions">
            <button class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
                <svg id="theme-icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="theme-icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
