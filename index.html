        /* ==========================================================================
           2. DOM XSS Sanitization Engine & Safety Checks
           ========================================================================== */
        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        function cleanHTML(htmlInput) {
            if (!htmlInput) return '';
            const temp = document.createElement('div');
            temp.innerHTML = htmlInput;

            const allowedTags = ['P', 'B', 'STRONG', 'UL', 'OL', 'LI', 'BR', 'A', 'DIV', 'SPAN'];

            function sanitizeNode(node) {
                const children = Array.from(node.childNodes);
                children.forEach(child => {
                    if (child.nodeType === Node.ELEMENT_NODE) {
                        if (!allowedTags.includes(child.nodeName)) {
                            const text = document.createTextNode(child.textContent);
                            node.replaceChild(text, child);
                        } else {
                            Array.from(child.attributes).forEach(attr => {
                                const attrName = attr.name.toLowerCase();
                                const attrValue = attr.value.toLowerCase();
                                if (attrName.startsWith('on') || attrValue.startsWith('javascript:')) {
                                    child.removeAttribute(attr.name);
                                }
                            });
                            if (child.nodeName === 'A') {
                                child.setAttribute('target', '_blank');
                                child.setAttribute('rel', 'noopener noreferrer');
                            }
                            sanitizeNode(child);
                        }
                    }
                });
            }

            sanitizeNode(temp);
            return temp.innerHTML;
        }

        function isValidURL(url) {
            if (!url) return false;
            try {
                // Allow web URLs, mailto, and file paths
                if (url.startsWith('mailto:') || url.startsWith('file:')) return true;
                const parsed = new URL(url);
                return parsed.protocol === 'http:' || parsed.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        function sanitizeCSVFormula(val) {
            if (val === null || val === undefined) return '';
            const str = String(val);
            if (/^[=+\-@\t\r]/.test(str)) {
                return "'" + str;
            }
            return str;
        }

        /* ==========================================================================
           3. Core Initialization & Theme Engine
           ========================================================================== */
        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
            loadBoardData();
            renderBoard();
            setupEventDelegation();
        });

        function initTheme() {
            const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'dark';
            applyTheme(savedTheme);
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            const sunIcon = document.getElementById('theme-icon-sun');
            const moonIcon = document.getElementById('theme-icon-moon');
            
            if (theme === 'light') {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            }
            localStorage.setItem(STORAGE_KEY_THEME, theme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
            applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
        }

        function loadBoardData() {
            const savedColumns = localStorage.getItem(STORAGE_KEY_COLUMNS);
            if (savedColumns) {
                try { columns = JSON.parse(savedColumns); } 
                catch (e) { columns = defaultColumns; }
            } else {
                columns = defaultColumns;
                saveColumnsToStorage();
            }

            const savedLabels = localStorage.getItem(STORAGE_KEY_LABELS);
            if (savedLabels) {
                try { globalLabels = JSON.parse(savedLabels); } 
                catch (e) { globalLabels = defaultGlobalLabels; }
            } else {
                globalLabels = defaultGlobalLabels;
                saveLabelsToStorage();
            }

            const savedTasks = localStorage.getItem(STORAGE_KEY_TASKS);
            if (savedTasks) {
                try { tasks = JSON.parse(savedTasks); } 
                catch (e) { tasks = defaultTasks; }
            } else {
                tasks = defaultTasks;
                saveTasksToStorage();
            }
        }

        function saveTasksToStorage() { localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(tasks)); }
        function saveColumnsToStorage() { localStorage.setItem(STORAGE_KEY_COLUMNS, JSON.stringify(columns)); }
        function saveLabelsToStorage() { localStorage.setItem(STORAGE_KEY_LABELS, JSON.stringify(globalLabels)); }

        /* ==========================================================================
           4. Global Labels Management & Propagation
           ========================================================================== */
        function openLabelsManagementModal() {
            renderGlobalLabelsList();
            document.getElementById('labels-management-modal').classList.add('active');
        }

        function closeLabelsManagementModal() {
            document.getElementById('labels-management-modal').classList.remove('active');
        }

        function renderGlobalLabelsList() {
            const container = document.getElementById('global-labels-list');
            container.innerHTML = '';

            globalLabels.forEach(lbl => {
                const row = document.createElement('div');
                row.className = 'label-input-row';
                row.dataset.id = lbl.id;

                row.innerHTML = `
                    <input type="text" class="form-control global-label-name-input" value="${escapeHTML(lbl.name)}" placeholder="Label Name" style="flex:1;">
                    <input type="color" class="label-color-picker global-label-color-picker" value="${escapeHTML(lbl.color || '#3b82f6')}">
                    <button type="button" class="btn-icon remove-global-label-btn" title="Delete Label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                `;
                container.appendChild(row);
            });
        }

        function addGlobalLabelRow() {
            const container = document.getElementById('global-labels-list');
            const newId = 'lbl_' + Date.now().toString(36);
            const row = document.createElement('div');
            row.className = 'label-input-row';
            row.dataset.id = newId;

            row.innerHTML = `
                <input type="text" class="form-control global-label-name-input" value="New Label" placeholder="Label Name" style="flex:1;">
                <input type="color" class="label-color-picker global-label-color-picker" value="#3b82f6">
                <button type="button" class="btn-icon remove-global-label-btn" title="Delete Label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            `;
            container.appendChild(row);
        }

        function saveAndPropagateLabels() {
            const rows = document.querySelectorAll('#global-labels-list .label-input-row');
            const updatedGlobalLabels = [];
            const labelMap = new Map();

            rows.forEach(row => {
                const id = row.dataset.id;
                const name = row.querySelector('.global-label-name-input').value.trim();
                const color = row.querySelector('.global-label-color-picker').value;

                if (name) {
                    const labelObj = { id, name, color };
                    updatedGlobalLabels.push(labelObj);
                    labelMap.set(id, labelObj);
                }
            });

            globalLabels = updatedGlobalLabels;
            saveLabelsToStorage();

            // Propagate through all tasks on the board
            tasks.forEach(task => {
                if (task.labels && task.labels.length > 0) {
                    const propagatedLabels = [];
                    task.labels.forEach(lbl => {
                        if (lbl.id && labelMap.has(lbl.id)) {
                            // Update with modified name & color
                            propagatedLabels.push({ ...labelMap.get(lbl.id) });
                        } else if (!lbl.id) {
                            // Fallback for older labels matched by name
                            const matched = globalLabels.find(g => g.name.toLowerCase() === lbl.name.toLowerCase());
                            if (matched) {
                                propagatedLabels.push({ ...matched });
                            } else {
                                propagatedLabels.push(lbl);
                            }
                        }
                    });
                    task.labels = propagatedLabels;
                }
            });

            saveTasksToStorage();
            renderBoard();
            closeLabelsManagementModal();

            // Refresh task modal if open
            if (document.getElementById('task-modal').classList.contains('active')) {
                renderLabelsEditor();
                renderModalLabelsView();
            }
        }

        /* ==========================================================================
           5. Column Management
           ========================================================================== */
        function addNewColumn() {
            const title = prompt('Enter column title:');
            if (!title || !title.trim()) return;

            const newColId = 'col_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
            columns.push({ id: newColId, title: title.trim() });
            saveColumnsToStorage();
            renderBoard();
        }

        function updateColumnTitle(columnId, newTitle) {
            const trimmed = newTitle.trim();
            const col = columns.find(c => c.id === columnId);
            if (!col || !trimmed) { renderBoard(); return; }
            col.title = trimmed;
            saveColumnsToStorage();
            renderBoard();
        }

        function deleteColumn(columnId) {
            if (columns.length <= 1) {
                alert('You must keep at least one column on the board.');
                return;
            }
            const colTasks = tasks.filter(t => t.status === columnId);
            const col = columns.find(c => c.id === columnId);
            const colName = col ? col.title : 'this column';

            let confirmMessage = `Are you sure you want to delete "${colName}"?`;
            if (colTasks.length > 0) {
                confirmMessage = `The column "${colName}" contains ${colTasks.length} task(s). Deleting it will permanently delete all these tasks. Proceed?`;
            }

            if (confirm(confirmMessage)) {
                columns = columns.filter(c => c.id !== columnId);
                tasks = tasks.filter(t => t.status !== columnId);
                saveColumnsToStorage();
                saveTasksToStorage();
                renderBoard();
            }
        }

        function moveColumn(columnId, direction) {
            const index = columns.findIndex(c => c.id === columnId);
            if (index === -1) return;
            const newIndex = index + direction;
            if (newIndex < 0 || newIndex >= columns.length) return;

            const temp = columns[index];
            columns[index] = columns[newIndex];
            columns[newIndex] = temp;

            saveColumnsToStorage();
            renderBoard();
        }

        /* ==========================================================================
           6. Backup & CSV Engine
           ========================================================================== */
        function saveJSONBackup() {
            const backupData = { columns, globalLabels, tasks, exportDate: new Date().toISOString() };
            const jsonStr = JSON.stringify(backupData, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `kanban_board_backup_${new Date().toISOString().split('T')[0]}.json`;
            anchor.click();
            URL.revokeObjectURL(url);
        }

        function openJSONBackup(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data && Array.isArray(data.columns) && Array.isArray(data.tasks)) {
                        columns = data.columns;
                        tasks = data.tasks;
                        if (Array.isArray(data.globalLabels)) globalLabels = data.globalLabels;
                        saveColumnsToStorage();
                        saveLabelsToStorage();
                        saveTasksToStorage();
                        renderBoard();
                        alert('Board backup restored successfully!');
                    } else {
                        alert('Invalid JSON backup file structure.');
                    }
                } catch (err) {
                    alert('Failed to parse backup JSON file.');
                }
            };
            reader.readAsText(file);
            e.target.value = '';
        }

        function exportTasksToCSV() {
            if (tasks.length === 0) { alert('No tasks available to export.'); return; }

            const headers = [
                'ID', 'Title', 'Column Name', 'Status ID', 'Priority',
                'Start Date', 'Due Date', 'Labels', 'Notes', 'Resource Links',
                'Subtasks Summary', 'Subtasks Detail', 'Comments'
            ];

            const rows = tasks.map(t => {
                const col = columns.find(c => c.id === t.status);
                const colTitle = col ? col.title : t.status;

                const totalSubtasks = t.checklist ? t.checklist.length : 0;
                const completedSubtasks = t.checklist ? t.checklist.filter(c => c.completed).length : 0;

                const labelsDetail = t.labels
                    ? t.labels.map(l => l.name).join(' | ')
                    : '';

                const subtasksDetail = t.checklist 
                    ? t.checklist.map(c => `[${c.completed ? 'x' : ' '}] ${c.text}`).join('; ')
                    : '';

                const linksDetail = t.links
                    ? t.links.map(l => `${l.title || l.type}: ${l.url}`).join(' | ')
                    : '';

                const commentsDetail = t.comments 
                    ? t.comments.map(cm => {
                        const temp = document.createElement('div');
                        temp.innerHTML = cm.text;
                        return `${cm.timestamp}: ${temp.textContent || temp.innerText || ''}`;
                    }).join(' | ')
                    : '';

                const tempNotes = document.createElement('div');
                tempNotes.innerHTML = t.notes || '';
                const plainNotes = tempNotes.textContent || tempNotes.innerText || '';

                return [
                    sanitizeCSVFormula(t.id),
                    sanitizeCSVFormula(t.title),
                    sanitizeCSVFormula(colTitle),
                    sanitizeCSVFormula(t.status),
                    sanitizeCSVFormula(t.priority),
                    sanitizeCSVFormula(t.startDate),
                    sanitizeCSVFormula(t.dueDate),
                    sanitizeCSVFormula(labelsDetail),
                    sanitizeCSVFormula(plainNotes),
                    sanitizeCSVFormula(linksDetail),
                    sanitizeCSVFormula(`${completedSubtasks}/${totalSubtasks}`),
                    sanitizeCSVFormula(subtasksDetail),
                    sanitizeCSVFormula(commentsDetail)
                ];
            });

            const csvContent = [headers, ...rows].map(row => {
                return row.map(field => `"${String(field).replace(/"/g, '""')}"`).join(',');
            }).join('\r\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const anchor = document.createElement('a');
            anchor.href = url;
            anchor.download = `kanban_board_export_${new Date().toISOString().split('T')[0]}.csv`;
            anchor.click();
            URL.revokeObjectURL(url);
        }

        /* ==========================================================================
           7. Board & Card Rendering Engine
           ========================================================================== */
        function renderBoard() {
            const container = document.getElementById('board-container');
            container.innerHTML = '';

            columns.forEach((col, index) => {
                const columnEl = document.createElement('section');
                columnEl.className = 'column';
                columnEl.dataset.colId = col.id;

                const columnTasks = tasks
                    .filter(t => t.status === col.id)
                    .sort((a, b) => (PRIORITY_WEIGHTS[b.priority] || 0) - (PRIORITY_WEIGHTS[a.priority] || 0));

                columnEl.innerHTML = `
                    <div class="column-header" draggable="true" data-col-id="${col.id}">
                        <div class="column-header-top">
                            <input type="text" class="column-title-input" data-col-id="${col.id}" value="${escapeHTML(col.title)}" title="Click to rename column">
                            <span class="badge">${columnTasks.length}</span>
                        </div>
                        <div class="column-controls">
                            <div class="column-nav-btns">
                                <button class="btn-icon move-col-btn" data-col-id="${col.id}" data-dir="-1" title="Move Left" ${index === 0 ? 'disabled style="opacity:0.3;"' : ''}>←</button>
                                <button class="btn-icon move-col-btn" data-col-id="${col.id}" data-dir="1" title="Move Right" ${index === columns.length - 1 ? 'disabled style="opacity:0.3;"' : ''}>→</button>
                            </div>
                            <div style="display:flex; gap:0.2rem;">
                                <button class="btn-icon add-column-task-btn" data-status="${col.id}" title="Add Task to ${escapeHTML(col.title)}">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                                </button>
                                <button class="btn-icon delete-column-btn" data-col-id="${col.id}" title="Delete Column">
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="task-list" id="${col.id}"></div>
                `;

                const taskListEl = columnEl.querySelector('.task-list');

                if (columnTasks.length === 0) {
                    taskListEl.innerHTML = `<div class="empty-state">No tasks in this column</div>`;
                } else {
                    columnTasks.forEach(task => taskListEl.appendChild(createTaskCardElement(task)));
                }

                container.appendChild(columnEl);
            });

            populateModalColumnOptions();
        }

        function populateModalColumnOptions() {
            const selectEl = document.getElementById('task-status-input');
            if (!selectEl) return;
            selectEl.innerHTML = '';
            columns.forEach(col => {
                const opt = document.createElement('option');
                opt.value = col.id;
                opt.textContent = col.title;
                selectEl.appendChild(opt);
            });
        }

        function createTaskCardElement(task) {
            const card = document.createElement('div');
            card.className = 'task-card';
            card.draggable = true;
            card.dataset.id = task.id;

            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = task.notes || '';
            const plainNotes = tempDiv.textContent || tempDiv.innerText || '';

            // Custom Labels Badges
            let labelsHTML = '';
            if (task.labels && task.labels.length > 0) {
                labelsHTML = `<div class="card-labels-container">`;
                task.labels.forEach(lbl => {
                    labelsHTML += `<span class="card-label-badge" style="background-color: ${escapeHTML(lbl.color || '#3b82f6')};">${escapeHTML(lbl.name)}</span>`;
                });
                labelsHTML += `</div>`;
            }

            // Named Resource Links Badges
            let linksHTML = '';
            if (task.links && task.links.length > 0) {
                linksHTML = `<div class="task-links-container">`;
                task.links.forEach(l => {
                    if (isValidURL(l.url)) {
                        const typeObj = LINK_TYPES.find(t => t.id === l.type) || LINK_TYPES[0];
                        const displayName = l.title ? l.title : typeObj.label;
                        linksHTML += `
                            <a href="${escapeHTML(l.url)}" target="_blank" rel="noopener noreferrer" class="link-badge ${typeObj.class}" onclick="event.stopPropagation()">
                                🔗 ${escapeHTML(displayName)}
                            </a>`;
                    }
                });
                linksHTML += `</div>`;
            }

            // Subtask Checklist
            let checklistHTML = '';
            const totalSubtasks = task.checklist ? task.checklist.length : 0;
            const completedSubtasks = task.checklist ? task.checklist.filter(c => c.completed).length : 0;

            if (totalSubtasks > 0) {
                const percent = Math.round((completedSubtasks / totalSubtasks) * 100);
                const itemsToDisplay = task.hideCompleted 
                    ? task.checklist.filter(c => !c.completed)
                    : task.checklist;

                checklistHTML = `
                    <div class="card-checklist">
                        <div class="checklist-header-toggle">
                            <span>Subtasks (${completedSubtasks}/${totalSubtasks})</span>
                        </div>
                        <div class="checklist-progress-bar">
                            <div class="checklist-progress-fill" style="width: ${percent}%;"></div>
                        </div>
                `;
                itemsToDisplay.forEach(item => {
                    checklistHTML += `
                        <label class="checklist-item ${item.completed ? 'completed' : ''}" onclick="event.stopPropagation()">
                            <input type="checkbox" class="subtask-checkbox" data-task-id="${task.id}" data-subtask-id="${item.id}" ${item.completed ? 'checked' : ''}>
                            <span>${escapeHTML(item.text)}</span>
                        </label>
                    `;
                });
                checklistHTML += `</div>`;
            }

            // Dates & Footer
            const today = new Date().toISOString().split('T')[0];
            let dateHTML = '';
            if (task.dueDate) {
                const isOverdue = task.dueDate < today && task.status !== 'done';
                dateHTML = `
                    <span class="date-badge ${isOverdue ? 'overdue' : ''}" title="Due Date">
                        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        ${formatDate(task.dueDate)}
                    </span>
                `;
            }

            const commentCount = task.comments ? task.comments.length : 0;

            card.innerHTML = `
                <div class="task-card-top">
                    <span class="priority-tag priority-${task.priority}">${task.priority}</span>
                    <div class="task-card-actions">
                        <button class="btn-icon edit-task-btn" data-id="${task.id}" title="Edit Task Direct">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        </button>
                        <button class="btn-icon delete-task-btn" data-id="${task.id}" title="Delete Task">
                            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        </button>
                    </div>
                </div>
                ${labelsHTML}
                <div class="task-title-link view-task-btn" data-id="${task.id}">${escapeHTML(task.title)}</div>
                ${plainNotes ? `<div class="task-single-line-preview">${escapeHTML(plainNotes)}</div>` : ''}
                ${linksHTML}
                ${checklistHTML}
                <div class="task-footer">
                    ${dateHTML}
                    ${commentCount > 0 ? `
                        <span style="display:flex; align-items:center; gap:0.25rem;" title="${commentCount} comments">
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                            ${commentCount}
                        </span>
                    ` : ''}
                </div>
            `;

            return card;
        }

        /* ==========================================================================
           8. Event Delegation & Drag/Drop Engine
           ========================================================================== */
        function setupEventDelegation() {
            const boardContainer = document.getElementById('board-container');

            boardContainer.addEventListener('click', (e) => {
                const viewBtn = e.target.closest('.view-task-btn');
                if (viewBtn) { openModal('view', null, viewBtn.dataset.id); return; }

                const editBtn = e.target.closest('.edit-task-btn');
                if (editBtn) { openModal('edit', null, editBtn.dataset.id); return; }

                const deleteBtn = e.target.closest('.delete-task-btn');
                if (deleteBtn) { deleteTask(deleteBtn.dataset.id); return; }

                const addColTaskBtn = e.target.closest('.add-column-task-btn');
                if (addColTaskBtn) { openModal('create', addColTaskBtn.dataset.status); return; }

                const deleteColBtn = e.target.closest('.delete-column-btn');
                if (deleteColBtn) { deleteColumn(deleteColBtn.dataset.colId); return; }

                const moveColBtn = e.target.closest('.move-col-btn');
                if (moveColBtn) { moveColumn(moveColBtn.dataset.colId, parseInt(moveColBtn.dataset.dir, 10)); return; }
            });

            boardContainer.addEventListener('change', (e) => {
                if (e.target.classList.contains('column-title-input')) {
                    updateColumnTitle(e.target.dataset.colId, e.target.value);
                } else if (e.target.classList.contains('subtask-checkbox')) {
                    toggleCardSubtask(e.target.dataset.taskId, e.target.dataset.subtaskId);
                }
            });

            boardContainer.addEventListener('keydown', (e) => {
                if (e.target.classList.contains('column-title-input') && e.key === 'Enter') {
                    e.target.blur();
                }
            });

            // Card & Column Drag and Drop Logic
            boardContainer.addEventListener('dragstart', (e) => {
                const card = e.target.closest('.task-card');
                const colHeader = e.target.closest('.column-header');

                if (window.getSelection().toString().length > 0) {
                    e.preventDefault();
                    return;
                }

                if (card) {
                    draggedTaskId = card.dataset.id;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', 'card:' + draggedTaskId);
                } else if (colHeader) {
                    draggedColumnId = colHeader.dataset.colId;
                    const col = colHeader.closest('.column');
                    if (col) col.classList.add('column-dragging');
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', 'col:' + draggedColumnId);
                }
            });

            boardContainer.addEventListener('dragend', (e) => {
                document.querySelectorAll('.task-card').forEach(c => c.classList.remove('dragging'));
                document.querySelectorAll('.column').forEach(c => c.classList.remove('column-dragging'));
                document.querySelectorAll('.task-list').forEach(l => l.classList.remove('drag-over'));
                draggedTaskId = null;
                draggedColumnId = null;
            });

            boardContainer.addEventListener('dragover', (e) => {
                const list = e.target.closest('.task-list');
                const col = e.target.closest('.column');
                if (list || col) {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                }
            });

            boardContainer.addEventListener('dragenter', (e) => {
                const list = e.target.closest('.task-list');
                if (list) { e.preventDefault(); list.classList.add('drag-over'); }
            });

            boardContainer.addEventListener('dragleave', (e) => {
                const list = e.target.closest('.task-list');
                if (list && e.relatedTarget && !list.contains(e.relatedTarget)) {
                    list.classList.remove('drag-over');
                }
            });

            boardContainer.addEventListener('drop', (e) => {
                e.preventDefault();
                const dropData = e.dataTransfer.getData('text/plain');

                if (dropData.startsWith('card:')) {
                    const list = e.target.closest('.task-list');
                    if (list) {
                        list.classList.remove('drag-over');
                        const targetStatus = list.id;
                        const taskId = dropData.replace('card:', '');
                        const task = tasks.find(t => t.id === taskId);
                        if (task) {
                            task.status = targetStatus;
                            saveTasksToStorage();
                            renderBoard();
                        }
                    }
                } else if (dropData.startsWith('col:')) {
                    const targetCol = e.target.closest('.column');
                    if (targetCol) {
                        const targetColId = targetCol.dataset.colId;
                        const sourceColId = dropData.replace('col:', '');
                        if (sourceColId !== targetColId) {
                            const srcIdx = columns.findIndex(c => c.id === sourceColId);
                            const tgtIdx = columns.findIndex(c => c.id === targetColId);
                            if (srcIdx !== -1 && tgtIdx !== -1) {
                                const [movedCol] = columns.splice(srcIdx, 1);
                                columns.splice(tgtIdx, 0, movedCol);
                                saveColumnsToStorage();
                                renderBoard();
                            }
                        }
                    }
                }
            });

            // Header Action Listeners
            document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);
            document.getElementById('manage-labels-header-btn').addEventListener('click', openLabelsManagementModal);
            document.getElementById('save-json-btn').addEventListener('click', saveJSONBackup);
            document.getElementById('open-json-btn').addEventListener('click', () => document.getElementById('json-file-input').click());
            document.getElementById('json-file-input').addEventListener('change', openJSONBackup);
            document.getElementById('add-column-header-btn').addEventListener('click', addNewColumn);
            document.getElementById('export-csv-btn').addEventListener('click', exportTasksToCSV);
            document.getElementById('add-task-header-btn').addEventListener('click', () => openModal('create'));

            // Global Labels Modal
            document.getElementById('close-labels-modal-x-btn').addEventListener('click', closeLabelsManagementModal);
            document.getElementById('add-global-label-btn').addEventListener('click', addGlobalLabelRow);
            document.getElementById('save-labels-modal-btn').addEventListener('click', saveAndPropagateLabels);
            document.getElementById('open-labels-modal-from-task').addEventListener('click', openLabelsManagementModal);

            document.getElementById('global-labels-list').addEventListener('click', (e) => {
                const removeBtn = e.target.closest('.remove-global-label-btn');
                if (removeBtn) {
                    const row = removeBtn.closest('.label-input-row');
                    if (row) row.remove();
                }
            });

            // Modal Controls & Form Listeners
            document.getElementById('close-modal-x-btn').addEventListener('click', closeModal);
            document.getElementById('close-modal-cancel-btn').addEventListener('click', closeModal);
            document.getElementById('task-modal').addEventListener('click', (e) => {
                if (e.target.classList.contains('modal-overlay')) closeModal();
            });

            document.getElementById('labels-management-modal').addEventListener('click', (e) => {
                if (e.target.classList.contains('modal-overlay')) closeLabelsManagementModal();
            });

            document.getElementById('modal-edit-toggle-btn').addEventListener('click', () => {
                setModalDisplayMode(currentModalMode === 'view' ? 'edit' : 'view');
            });

            document.getElementById('task-form').addEventListener('submit', saveTask);
            document.getElementById('add-subtask-btn').addEventListener('click', addChecklistItemFromInput);
            document.getElementById('add-label-row-btn').addEventListener('click', () => addLabelRow());
            document.getElementById('add-link-row-btn').addEventListener('click', () => addLinkRow());
            document.getElementById('save-comment-btn').addEventListener('click', saveCommentFromEditor);
            document.getElementById('cancel-edit-comment-btn').addEventListener('click', resetCommentEditor);

            document.getElementById('modal-hide-completed-toggle').addEventListener('change', (e) => {
                const taskId = document.getElementById('task-id').value;
                if (taskId) {
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.hideCompleted = e.target.checked;
                        saveTasksToStorage();
                    }
                }
                renderModalChecklist();
                renderBoard();
            });

            // Rich Text Toolbar Binding
            document.querySelectorAll('.rich-toolbar .toolbar-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const cmd = btn.dataset.command;
                    if (cmd === 'createLink') {
                        const url = prompt('Enter URL:');
                        if (url) document.execCommand('createLink', false, url);
                    } else if (cmd) {
                        document.execCommand(cmd, false, null);
                    }
                });
            });

            document.getElementById('comment-bold-btn').addEventListener('click', () => document.execCommand('bold'));
            document.getElementById('comment-list-btn').addEventListener('click', () => document.execCommand('insertUnorderedList'));
            document.getElementById('comment-link-btn').addEventListener('click', () => {
                const url = prompt('Enter link URL:');
                if (url) document.execCommand('createLink', false, url);
            });

            // Modal List Event Delegations
            document.getElementById('modal-checklist-container').addEventListener('click', (e) => {
                const removeBtn = e.target.closest('.remove-subtask-btn');
                if (removeBtn && currentModalMode === 'edit') {
                    const idx = parseInt(removeBtn.dataset.index, 10);
                    currentModalChecklist.splice(idx, 1);
                    renderModalChecklist();
                }
            });

            document.getElementById('modal-comments-container').addEventListener('click', (e) => {
                const editCmBtn = e.target.closest('.edit-comment-btn');
                if (editCmBtn) {
                    startEditingComment(editCmBtn.dataset.id);
                    return;
                }
                const delCmBtn = e.target.closest('.delete-comment-btn');
                if (delCmBtn) {
                    deleteComment(delCmBtn.dataset.id);
                    return;
                }
            });

            document.getElementById('labels-editor-container').addEventListener('click', (e) => {
                const removeLabelBtn = e.target.closest('.remove-label-btn');
                if (removeLabelBtn) {
                    const row = removeLabelBtn.closest('.label-input-row');
                    if (row) row.remove();
                }
            });

            document.getElementById('labels-editor-container').addEventListener('change', (e) => {
                const select = e.target.closest('.label-dropdown-select');
                if (select) {
                    const row = select.closest('.label-input-row');
                    const textInput = row.querySelector('.label-name-input');
                    const colorPicker = row.querySelector('.label-color-picker');
                    const val = select.value;

                    if (val === 'NEW_LABEL') {
                        textInput.value = '';
                        textInput.focus();
                    } else {
                        const matched = globalLabels.find(l => l.id === val);
                        if (matched) {
                            textInput.value = matched.name;
                            colorPicker.value = matched.color;
                        }
                    }
                }
            });

            document.getElementById('links-editor-container').addEventListener('click', (e) => {
                const removeLinkBtn = e.target.closest('.remove-link-btn');
                if (removeLinkBtn) {
                    const row = removeLinkBtn.closest('.link-input-row');
                    if (row) row.remove();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                    closeLabelsManagementModal();
                }
            });
        }

        function toggleCardSubtask(taskId, subtaskId) {
            const task = tasks.find(t => t.id === taskId);
            if (task && task.checklist) {
                const item = task.checklist.find(c => c.id === subtaskId);
                if (item) {
                    item.completed = !item.completed;
                    saveTasksToStorage();
                    renderBoard();
                }
            }
        }

        /* ==========================================================================
           9. Modal Display Mode & Dynamic Form Management
           ========================================================================== */
        function setModalDisplayMode(mode) {
            currentModalMode = mode;
            const editElems = document.querySelectorAll('#task-modal .edit-mode-elem');
            const viewElems = document.querySelectorAll('#task-modal .view-mode-elem');
            const editToggleBtn = document.getElementById('modal-edit-toggle-btn');

            if (mode === 'view') {
                editElems.forEach(el => el.style.display = 'none');
                viewElems.forEach(el => el.style.display = 'block');
                editToggleBtn.style.display = 'inline-flex';
                editToggleBtn.innerHTML = `
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Edit`;
            } else {
                editElems.forEach(el => el.style.display = '');
                viewElems.forEach(el => el.style.display = 'none');
                const taskId = document.getElementById('task-id').value;
                if (!taskId) {
                    editToggleBtn.style.display = 'none';
                } else {
                    editToggleBtn.style.display = 'inline-flex';
                    editToggleBtn.innerHTML = `View Card`;
                }
            }
            renderModalChecklist();
            renderModalLabelsView();
            renderModalLinksView();
        }

        function openModal(initialMode = 'create', defaultStatus = null, taskId = null) {
            const modal = document.getElementById('task-modal');
            const form = document.getElementById('task-form');
            const modalTitle = document.getElementById('modal-title-text');

            form.reset();
            resetCommentEditor();

            const fallbackStatus = defaultStatus || (columns.length > 0 ? columns[0].id : 'todo');

            if (taskId) {
                const task = tasks.find(t => t.id === taskId);
                if (!task) return;

                const col = columns.find(c => c.id === task.status);

                document.getElementById('task-id').value = task.id;
                document.getElementById('task-title-input').value = task.title;
                document.getElementById('task-priority-input').value = task.priority;
                document.getElementById('task-status-input').value = task.status;
                document.getElementById('task-start-input').value = task.startDate || '';
                document.getElementById('task-due-input').value = task.dueDate || '';
                document.getElementById('task-notes-editor').innerHTML = cleanHTML(task.notes || '');
                document.getElementById('modal-hide-completed-toggle').checked = !!task.hideCompleted;

                document.getElementById('view-title').textContent = task.title;
                document.getElementById('view-priority').textContent = task.priority;
                document.getElementById('view-status').textContent = col ? col.title : task.status;
                document.getElementById('view-start-date').textContent = formatDate(task.startDate) || 'None';
                document.getElementById('view-due-date').textContent = formatDate(task.dueDate) || 'None';
                document.getElementById('view-notes').innerHTML = cleanHTML(task.notes || '<p style="color:var(--text-muted)">No notes provided.</p>');

                currentModalChecklist = task.checklist ? JSON.parse(JSON.stringify(task.checklist)) : [];
                currentModalComments = task.comments ? JSON.parse(JSON.stringify(task.comments)) : [];
                currentModalLinks = task.links ? JSON.parse(JSON.stringify(task.links)) : [];
                currentModalLabels = task.labels ? JSON.parse(JSON.stringify(task.labels)) : [];

                modalTitle.textContent = initialMode === 'view' ? 'Task Details' : 'Edit Task';
            } else {
                modalTitle.textContent = 'New Task';
                document.getElementById('task-id').value = '';
                document.getElementById('task-status-input').value = fallbackStatus;
                document.getElementById('task-notes-editor').innerHTML = '';
                document.getElementById('modal-hide-completed-toggle').checked = false;

                currentModalChecklist = [];
                currentModalComments = [];
                currentModalLinks = [];
                currentModalLabels = [];
            }

            renderLabelsEditor();
            renderLinksEditor();
            renderModalComments();
            setModalDisplayMode(initialMode);

            modal.classList.add('active');
            if (initialMode !== 'view') {
                setTimeout(() => document.getElementById('task-title-input').focus(), 50);
            }
        }

        function closeModal() {
            const commentEditor = document.getElementById('new-comment-editor');
            if (commentEditor && commentEditor.textContent.trim() !== '') {
                saveCommentFromEditor();
            }
            document.getElementById('task-modal').classList.remove('active');
        }

        /* Subtask Checklist Engine */
        function renderModalChecklist() {
            const container = document.getElementById('modal-checklist-container');
            container.innerHTML = '';

            const hideComp = document.getElementById('modal-hide-completed-toggle').checked;
            const itemsToRender = hideComp ? currentModalChecklist.filter(c => !c.completed) : currentModalChecklist;

            if (itemsToRender.length === 0) {
                container.innerHTML = `<div style="font-size:0.8rem; color: var(--text-muted); padding: 0.2rem 0;">No subtasks to display.</div>`;
                return;
            }

            itemsToRender.forEach((item) => {
                const realIndex = currentModalChecklist.findIndex(c => c.id === item.id);
                const row = document.createElement('div');
                row.className = 'modal-checklist-row';

                if (currentModalMode === 'view') {
                    row.innerHTML = `
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="currentModalChecklist[${realIndex}].completed = this.checked; saveCurrentChecklistState();">
                        <span style="font-size: 0.85rem; flex: 1; ${item.completed ? 'text-decoration: line-through; color: var(--text-muted);' : ''}">${escapeHTML(item.text)}</span>
                    `;
                } else {
                    row.innerHTML = `
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="currentModalChecklist[${realIndex}].completed = this.checked">
                        <input type="text" value="${escapeHTML(item.text)}" onchange="currentModalChecklist[${realIndex}].text = this.value">
                        <button type="button" class="btn-icon remove-subtask-btn" data-index="${realIndex}" title="Remove item">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    `;
                }
                container.appendChild(row);
            });
        }

        function saveCurrentChecklistState() {
            const taskId = document.getElementById('task-id').value;
            if (!taskId) return;
            const task = tasks.find(t => t.id === taskId);
            if (task) {
                task.checklist = currentModalChecklist;
                saveTasksToStorage();
                renderBoard();
            }
        }

        function addChecklistItemFromInput() {
            const input = document.getElementById('new-checklist-input');
            const text = input.value.trim();
            if (text) {
                currentModalChecklist.push({
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                    text: text,
                    completed: false
                });
                input.value = '';
                renderModalChecklist();
            }
        }

        /* Dynamic Task Labels Engine */
        function renderLabelsEditor() {
            const container = document.getElementById('labels-editor-container');
            container.innerHTML = '';
            currentModalLabels.forEach(lbl => addLabelRow(lbl.id, lbl.name, lbl.color));
        }

        function addLabelRow(selectedId = '', name = '', color = '#3b82f6') {
            const container = document.getElementById('labels-editor-container');
            const row = document.createElement('div');
            row.className = 'label-input-row';

            let optionsHTML = `<option value="NEW_LABEL">+ Type New Label</option>`;
            globalLabels.forEach(gl => {
                const isSelected = gl.id === selectedId || gl.name.toLowerCase() === name.toLowerCase();
                optionsHTML += `<option value="${gl.id}" ${isSelected ? 'selected' : ''}>${escapeHTML(gl.name)}</option>`;
            });

            row.innerHTML = `
                <select class="form-control label-dropdown-select" style="width: 160px;">${optionsHTML}</select>
                <input type="text" class="form-control label-name-input" placeholder="Label name" value="${escapeHTML(name)}" style="flex:1;">
                <input type="color" class="label-color-picker" value="${escapeHTML(color)}">
                <button type="button" class="btn-icon remove-label-btn" title="Remove Label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            `;
            container.appendChild(row);
        }

        function renderModalLabelsView() {
            const viewContainer = document.getElementById('view-labels');
            viewContainer.innerHTML = '';

            if (currentModalLabels.length === 0) {
                viewContainer.textContent = 'None';
                return;
            }

            const labelsWrapper = document.createElement('div');
            labelsWrapper.className = 'card-labels-container';

            currentModalLabels.forEach(lbl => {
                labelsWrapper.innerHTML += `<span class="card-label-badge" style="background-color: ${escapeHTML(lbl.color || '#3b82f6')};">${escapeHTML(lbl.name)}</span>`;
            });

            viewContainer.appendChild(labelsWrapper);
        }

        /* Dynamic Link Builder Engine */
        function renderLinksEditor() {
            const container = document.getElementById('links-editor-container');
            container.innerHTML = '';
            currentModalLinks.forEach(link => addLinkRow(link.type, link.url, link.title));
        }

        function addLinkRow(type = 'doc', url = '', title = '') {
            const container = document.getElementById('links-editor-container');
            const row = document.createElement('div');
            row.className = 'link-input-row';

            let optionsHTML = LINK_TYPES.map(t => `<option value="${t.id}" ${t.id === type ? 'selected' : ''}>${t.label}</option>`).join('');

            row.innerHTML = `
                <select class="form-control link-type-select" style="width: 140px;">${optionsHTML}</select>
                <input type="text" class="form-control link-title-input" placeholder="Display Name" value="${escapeHTML(title)}" style="width: 130px;">
                <input type="text" class="form-control link-url-input" placeholder="URL or path..." value="${escapeHTML(url)}" style="flex:1;">
                <button type="button" class="btn-icon remove-link-btn" title="Remove Link">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            `;
            container.appendChild(row);
        }

        function renderModalLinksView() {
            const viewContainer = document.getElementById('view-links');
            viewContainer.innerHTML = '';

            if (currentModalLinks.length === 0) {
                viewContainer.textContent = 'None';
                return;
            }

            const linksWrapper = document.createElement('div');
            linksWrapper.className = 'task-links-container';

            currentModalLinks.forEach(l => {
                if (isValidURL(l.url)) {
                    const typeObj = LINK_TYPES.find(t => t.id === l.type) || LINK_TYPES[0];
                    const displayName = l.title ? l.title : typeObj.label;
                    linksWrapper.innerHTML += `
                        <a href="${escapeHTML(l.url)}" target="_blank" rel="noopener noreferrer" class="link-badge ${typeObj.class}">
                            🔗 ${escapeHTML(displayName)}
                        </a>`;
                }
            });

            viewContainer.appendChild(linksWrapper);
        }

        /* Comments Engine */
        function renderModalComments() {
            const container = document.getElementById('modal-comments-container');
            container.innerHTML = '';

            if (currentModalComments.length === 0) {
                container.innerHTML = `<div style="font-size:0.8rem; color: var(--text-muted); padding: 0.2rem 0;">No comments yet.</div>`;
                return;
            }

            currentModalComments.forEach((cm) => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.innerHTML = `
                    <div class="comment-meta">
                        <span>User • ${escapeHTML(cm.timestamp)}</span>
                        <div class="comment-actions">
                            <button class="btn-icon edit-comment-btn" data-id="${cm.id}" title="Edit Comment">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                            </button>
                            <button class="btn-icon delete-comment-btn" data-id="${cm.id}" title="Delete Comment">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            </button>
                        </div>
                    </div>
                    <div class="comment-text">${cleanHTML(cm.text)}</div>
                `;
                container.appendChild(item);
            });
        }

        function startEditingComment(commentId) {
            const cm = currentModalComments.find(c => c.id === commentId);
            if (!cm) return;

            editingCommentId = commentId;
            const editor = document.getElementById('new-comment-editor');
            editor.innerHTML = cleanHTML(cm.text);

            document.getElementById('save-comment-btn').textContent = 'Update Comment';
            document.getElementById('cancel-edit-comment-btn').style.display = 'inline-flex';
            editor.focus();
        }

        function resetCommentEditor() {
            editingCommentId = null;
            document.getElementById('new-comment-editor').innerHTML = '';
            document.getElementById('save-comment-btn').textContent = 'Save Comment';
            document.getElementById('cancel-edit-comment-btn').style.display = 'none';
        }

        function saveCommentFromEditor() {
            const editor = document.getElementById('new-comment-editor');
            const rawContent = editor.innerHTML.trim();
            const textContent = editor.textContent.trim();

            if (textContent !== '') {
                const now = new Date();
                const formattedTimestamp = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + ', ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

                if (editingCommentId) {
                    const cm = currentModalComments.find(c => c.id === editingCommentId);
                    if (cm) {
                        cm.text = cleanHTML(rawContent);
                        cm.timestamp = formattedTimestamp + ' (edited)';
                    }
                } else {
                    currentModalComments.unshift({
                        id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
                        text: cleanHTML(rawContent),
                        timestamp: formattedTimestamp
                    });
                }

                resetCommentEditor();
                renderModalComments();

                const taskId = document.getElementById('task-id').value;
                if (taskId) {
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.comments = currentModalComments;
                        saveTasksToStorage();
                        renderBoard();
                    }
                }
            }
        }

        function deleteComment(commentId) {
            if (confirm('Delete this comment?')) {
                currentModalComments = currentModalComments.filter(c => c.id !== commentId);
                renderModalComments();

                const taskId = document.getElementById('task-id').value;
                if (taskId) {
                    const task = tasks.find(t => t.id === taskId);
                    if (task) {
                        task.comments = currentModalComments;
                        saveTasksToStorage();
                        renderBoard();
                    }
                }
            }
        }

        /* Save Task Logic */
        function saveTask(e) {
            e.preventDefault();

            const id = document.getElementById('task-id').value;
            const title = document.getElementById('task-title-input').value.trim();
            const priority = document.getElementById('task-priority-input').value;
            const status = document.getElementById('task-status-input').value;
            const startDate = document.getElementById('task-start-input').value;
            const dueDate = document.getElementById('task-due-input').value;
            const notes = cleanHTML(document.getElementById('task-notes-editor').innerHTML);
            const hideCompleted = document.getElementById('modal-hide-completed-toggle').checked;

            if (!title) return;

            // Extract custom labels
            const labelRows = document.querySelectorAll('#labels-editor-container .label-input-row');
            const extractedLabels = [];
            
            labelRows.forEach(row => {
                const selectVal = row.querySelector('.label-dropdown-select').value;
                const name = row.querySelector('.label-name-input').value.trim();
                const color = row.querySelector('.label-color-picker').value;

                if (name) {
                    if (selectVal !== 'NEW_LABEL') {
                        extractedLabels.push({ id: selectVal, name, color });
                    } else {
                        // Register newly typed label into global repository
                        let existingGlobal = globalLabels.find(g => g.name.toLowerCase() === name.toLowerCase());
                        if (existingGlobal) {
                            extractedLabels.push({ ...existingGlobal, color });
                        } else {
                            const newGlobalId = 'lbl_' + Date.now().toString(36) + Math.random().toString(36).substr(2, 3);
                            const newLblObj = { id: newGlobalId, name, color };
                            globalLabels.push(newLblObj);
                            extractedLabels.push(newLblObj);
                        }
                    }
                }
            });

            saveLabelsToStorage();

            // Extract resource links
            const linkRows = document.querySelectorAll('#links-editor-container .link-input-row');
            const extractedLinks = [];
            linkRows.forEach(row => {
                const type = row.querySelector('.link-type-select').value;
                const linkTitle = row.querySelector('.link-title-input').value.trim();
                const url = row.querySelector('.link-url-input').value.trim();
                if (url && isValidURL(url)) {
                    extractedLinks.push({ type, title: linkTitle, url });
                }
            });

            const cleanedChecklist = currentModalChecklist.filter(item => item.text.trim() !== '');

            if (id) {
                const taskIndex = tasks.findIndex(t => t.id === id);
                if (taskIndex !== -1) {
                    tasks[taskIndex] = {
                        ...tasks[taskIndex],
                        title,
                        notes,
                        priority,
                        status,
                        startDate,
                        dueDate,
                        hideCompleted,
                        labels: extractedLabels,
                        links: extractedLinks,
                        checklist: cleanedChecklist,
                        comments: currentModalComments
                    };
                }
            } else {
                const newTask = {
                    id: Date.now().toString(36) + Math.random().toString(36).substr(2, 5),
                    title,
                    notes,
                    priority,
                    status,
                    startDate,
                    dueDate,
                    hideCompleted,
                    labels: extractedLabels,
                    links: extractedLinks,
                    checklist: cleanedChecklist,
                    comments: currentModalComments
                };
                tasks.push(newTask);
            }

            saveTasksToStorage();
            renderBoard();
            closeModal();
        }

        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveTasksToStorage();
                renderBoard();
            }
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const parts = dateString.split('-');
            if (parts.length !== 3) return dateString;
            const date = new Date(parts[0], parts[1] - 1, parts[2]);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
        }
    </script>
</body>
</html>
